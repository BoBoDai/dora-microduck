# Upstream autonomous brain, split into dora nodes.
#
#   cargo build
#   scripts/dora-sim autod
#
#   robotd-state ──robot_state──┐
#                              ├──▶ autod ──cmd_vel / head / mouth / body / sound / skill──▶ wrapper
#   tof ──────────tof───────────┘
#
# `robotd-state` and `tof` are the only nodes with sockets (`ROBOTD_SOCKET` and `TOF_SOCKET`);
# `autod` is the pure upstream state machine over dora messages, and `robotd-wrapper` is the
# single intent sink. The brain itself is the 12-state port from
# `pollen-robotics/microduck` `origin/autonomous-mode` (commit df9a750): BallPlay, Held,
# Startle and Preen were already left behind upstream.
#
# `robot_state` is compact JSON from `dora-robotd-state`: t_ns, policy, fallen, sitting, head
# joints, gravity, trunk height, odometry pose, and the subscribe ack's ground_pick/sitstand
# abilities. `tof` is a serialized `TofFrame` from `dora-tof`. Without ToF the brain looks
# around but never advances.
nodes:
  - id: robotd-state
    path: ../target/debug/dora-robotd-state
    inputs:
      tick: dora/timer/millis/20
    outputs:
      - joint_state
      - odom
      - imu
      - robot_state

  - id: tof
    path: ../target/debug/dora-tof
    outputs:
      - tof

  - id: autod
    path: ../target/debug/dora-autod
    inputs:
      tick: dora/timer/millis/20
      robot_state: robotd-state/robot_state
      tof: tof/tof
    outputs:
      - cmd_vel
      - head
      - mouth
      - body
      - sound
      - skill

  - id: robotd-wrapper
    path: ../target/debug/dora-robotd-wrapper
    inputs:
      cmd_vel: autod/cmd_vel
      head: autod/head
      mouth: autod/mouth
      body: autod/body
      sound: autod/sound
      skill: autod/skill
