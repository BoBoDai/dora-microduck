# Simulation loop for the duck.
#
#   cargo build
#   dora run dataflows/sim.yml
#
# Paths are resolved relative to this file, hence the `../target/...` prefix.
#
# The upstream twin (`scripts/duck-sim`) runs the real `robotd` against a
# MuJoCo body, so this graph does not simulate anything itself:
#
#   robotd ──robot.state──▶ robotd-state ──joint_state / odom / imu──▶ (behaviour nodes)
#
#   keyboard ──cmd_vel──▶ robotd-wrapper ──robot.move──▶ robotd
#
#   mediad ──media.frame──▶ camera ──image (SHM)──▶ frame-sink (debug)
#
# `robotd-state` subscribes on ROBOTD_SOCKET; `camera` pulls raw frames on
# MEDIA_FRAME_SOCKET. Both log and publish nothing when their socket is unset,
# and the rest of the graph still runs. For the simulated camera, start the twin
# with `DUCK_SIM_CAMERAS=a` so `duck-sim` runs `mediad --sim-camera`; the
# launcher then exports the matching frame socket. A real robot uses
# `/run/mediad/media.sock`.
#
# `frame-sink` is a debug consumer: it reads the frame in place and logs it, and
# it gives `camera` a subscriber so the shared-memory path is exercised without
# starting the autonomous graph. `dataflows/reactive.yml` is the separate
# camera -> perception -> brain loop; do not run both graphs against the same
# robot, because both would write `cmd_vel` to the wrapper.
nodes:
  - id: robotd-state
    path: ../target/debug/dora-robotd-state
    inputs:
      tick: dora/timer/millis/20
    outputs:
      - joint_state
      - odom
      - imu

  - id: camera
    path: ../target/debug/dora-camera
    inputs:
      tick: dora/timer/millis/33
    outputs:
      - image
    shared_memory_pool_size: 64MB

  - id: frame-sink
    path: ../target/debug/dora-frame-sink
    inputs:
      image: camera/image

  - id: keyboard
    path: ../target/debug/dora-keyboard
    inputs:
      tick: dora/timer/millis/50
    outputs:
      - cmd_vel

  - id: robotd-wrapper
    path: ../target/debug/dora-robotd-wrapper
    inputs:
      cmd_vel: keyboard/cmd_vel
